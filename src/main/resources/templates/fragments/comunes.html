
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo}">Clínica Veterinaria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}" th:text="#{app.nombre}">Clínica Veterinaria</a>
        
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <li><a class="nav-link" th:href="@{/}" th:text="#{nav.inicio}">Inicio</a>
                </li>
                <li class="nav-item">
                    <li><a class="nav-link" th:href="@{/tipos-servicio}" th:text="#{nav.tipos}">Tipos de servicio</a>
                </li>
                <li class="nav-item">
                    <li><a class="nav-link" th:href="@{/servicios}" th:text="#{nav.servicios}">Servicios</a>
                </li>
                <li class="nav-item">
                    <li><a class="nav-link" th:href="@{/citas}" th:text="#{nav.citas}">Citas</a>
                </li>
               <li><a class="nav-link" th:href="@{/contacto}" th:text="#{nav.contacto}">Contacto</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<footer th:fragment="footer" class="bg-light text-center py-3 mt-5">
    <div class="container">
        <p class="mb-0">&copy; 2026 Clínica Veterinaria. Cuidamos a tus mascotas.</p>
    </div>
</footer>

<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</div>

</body>
</html>
