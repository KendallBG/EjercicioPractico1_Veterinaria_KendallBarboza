
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo}">Clínica Veterinaria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<header th:fragment="header" class="bg-light py-4">
    <div class="container text-center">
        <h1 class="mb-2" th:text="#{header.titulo}">
            Clínica Veterinaria
        </h1>
        <p class="mb-0" th:text="#{header.descripcion}">
            Cuidamos la salud y el bienestar de tus mascotas.
        </p>
    </div>
</header>

<nav th:fragment="navbar"
     class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}" th:text="#{app.nombre}">
            Clínica Veterinaria
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#menu"
                aria-controls="menu" aria-expanded="false"
                aria-label="Abrir menú">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}"
                       th:text="#{nav.inicio}">Inicio</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/tipos-servicio}"
                       th:text="#{nav.tipos}">Tipos de servicio</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/servicios}"
                       th:text="#{nav.servicios}">Servicios</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/citas}"
                       th:text="#{nav.citas}">Citas</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/contacto}"
                       th:text="#{nav.contacto}">Contacto</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<footer th:fragment="footer" class="bg-light text-center py-3 mt-5">
    <div class="container">
        <p class="mb-0" th:text="#{footer.mensaje}">
            Clínica Veterinaria. Cuidamos a tus mascotas.
        </p>
    </div>
</footer>

<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</div>

</body>
</html>
