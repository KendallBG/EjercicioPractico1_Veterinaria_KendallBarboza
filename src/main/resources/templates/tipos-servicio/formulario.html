
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/comunes :: head(${titulo})}"></head>
<body>

<div th:replace="~{fragments/comunes :: navbar}"></div>

<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">

            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h1 class="h4 mb-0" th:text="${titulo}">
                        Tipo de servicio
                    </h1>
                </div>

                <div class="card-body">
                    <form th:action="@{/tipos-servicio/guardar}"
                          th:object="${tipoServicio}" method="post">

                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label for="nombre" class="form-label">
                                Nombre
                            </label>
                            <input type="text" id="nombre"
                                   class="form-control"
                                   th:field="*{nombre}"
                                   maxlength="100" required
                                   placeholder="Ej. Consulta General">
                        </div>

                        <div class="mb-3">
                            <label for="descripcion" class="form-label">
                                Descripción
                            </label>
                            <textarea id="descripcion"
                                      class="form-control"
                                      th:field="*{descripcion}"
                                      maxlength="255" rows="4"
                                      placeholder="Descripción del tipo de servicio"></textarea>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/tipos-servicio}"
                               class="btn btn-secondary">
                                Cancelar
                            </a>

                            <button type="submit" class="btn btn-primary">
                                Guardar
                            </button>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </div>
</main>

<div th:replace="~{fragments/comunes :: footer}"></div>
<div th:replace="~{fragments/comunes :: scripts}"></div>

</body>
</html>
