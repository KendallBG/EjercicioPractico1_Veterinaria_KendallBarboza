
<!DOCTYPE html>

<nav th:replace="~{fragments/comunes :: navbar}"></nav>

        <div class="card-body p-5">
            <h1 class="text-success">¡Gracias por contactarnos!</h1>

        </div>
    </div>

<footer th:replace="~{fragments/comunes :: footer}"></footer>

</body>
</html>
