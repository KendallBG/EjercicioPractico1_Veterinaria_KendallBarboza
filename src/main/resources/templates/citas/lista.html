
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/comunes :: head('Citas registradas')}"></head>
<body>

    <header th:replace="~{fragments/comunes :: header}"></header>
<nav th:replace="~{fragments/comunes :: navbar}"></nav>

<main class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1>Citas registradas</h1>
            <p class="text-muted">
                Consulta las citas programadas para las mascotas.
            </p>
        </div>
        <a th:href="@{/}" class="btn btn-outline-primary">
            Volver al inicio
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-primary">
                        <tr>
                            <th>Mascota</th>
                            <th>Propietario</th>
                            <th>Fecha</th>
                            <th>Servicio</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="cita : ${citas}">
                            <td th:text="${cita.nombreMascota}"></td>
                            <td th:text="${cita.nombrePropietario}"></td>
                            <td th:text="${#temporals.format(cita.fecha, 'dd/MM/yyyy')}"></td>
                            <td th:text="${cita.servicio != null ? cita.servicio.nombre : 'Sin servicio asignado'}"></td>
                        </tr>

                        <tr th:if="${#lists.isEmpty(citas)}">
                            <td colspan="4" class="text-center text-muted py-4">
                                No hay citas registradas.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/comunes :: footer}"></footer>
<div th:replace="~{fragments/comunes :: scripts}"></div>

</body>
</html>
