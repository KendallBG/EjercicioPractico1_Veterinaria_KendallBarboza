
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/comunes :: head('Servicios veterinarios')}"></head>
<body>

    <header th:replace="~{fragments/comunes :: header}"></header>
<div th:replace="~{fragments/comunes :: navbar}"></div>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Servicios veterinarios</h1>
        <a th:href="@{/servicios/nuevo}" class="btn btn-primary">
            Nuevo servicio
        </a>
    </div>

    <div th:if="${mensaje}" class="alert alert-success"
         th:text="${mensaje}"></div>

    <div th:if="${error}" class="alert alert-danger"
         th:text="${error}"></div>

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-primary">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Tipo de servicio</th>
                    <th>Precio</th>
                    <th>Duración</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="servicio : ${servicios}">
                    <td th:text="${servicio.id}"></td>
                    <td th:text="${servicio.nombre}"></td>
                    <td th:text="${servicio.tipoServicio != null ? servicio.tipoServicio.nombre : 'Sin categoría'}"></td>
                    <td>
                        ₡<span th:text="${servicio.precio}"></span>
                    </td>
                    <td>
                        <span th:text="${servicio.duracionMinutos}"></span> min
                    </td>
                    <td>
                        <a th:href="@{/servicios/editar/{id}(id=${servicio.id})}"
                           class="btn btn-warning btn-sm">Editar</a>

                        <button type="button" class="btn btn-danger btn-sm"
                                data-bs-toggle="modal"
                                data-bs-target="#modalEliminar"
                                th:attr="data-id=${servicio.id},data-nombre=${servicio.nombre}">
                            Eliminar
                        </button>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(servicios)}">
                    <td colspan="6" class="text-center">
                        No hay servicios registrados.
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</main>

<div class="modal fade" id="modalEliminar" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Confirmar eliminación</h5>
                <button type="button" class="btn-close"
                        data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
                ¿Deseás eliminar el servicio
                <strong id="nombreServicio"></strong>?
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary"
                        data-bs-dismiss="modal">Cancelar</button>
                <form id="formEliminar" method="post">
                    <button type="submit" class="btn btn-danger">Eliminar</button>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/comunes :: footer}"></div>
<div th:replace="~{fragments/comunes :: scripts}"></div>

<script>
    const modalEliminar = document.getElementById('modalEliminar');

    modalEliminar.addEventListener('show.bs.modal', function (event) {
        const boton = event.relatedTarget;
        const id = boton.getAttribute('data-id');
        const nombre = boton.getAttribute('data-nombre');

        document.getElementById('nombreServicio').textContent = nombre;
        document.getElementById('formEliminar').action =
            '/servicios/eliminar/' + id;
    });
</script>

</body>
</html>
