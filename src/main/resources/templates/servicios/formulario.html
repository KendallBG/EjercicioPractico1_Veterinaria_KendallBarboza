
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/comunes :: head(${titulo})}"></head>
<body>

<div th:replace="~{fragments/comunes :: navbar}"></div>

<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">

            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h1 class="h4 mb-0" th:text="${titulo}">
                        Servicio veterinario
                    </h1>
                </div>

                <div class="card-body">
                    <form th:action="@{/servicios/guardar}"
                          th:object="${servicio}" method="post">

                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label for="nombre" class="form-label">
                                Nombre del servicio
                            </label>
                            <input type="text" id="nombre"
                                   class="form-control"
                                   th:field="*{nombre}"
                                   maxlength="100" required
                                   placeholder="Ej. Consulta Medicina General">
                        </div>

                        <div class="mb-3">
                            <label for="precio" class="form-label">
                                Precio (₡)
                            </label>
                            <input type="number" id="precio"
                                   class="form-control"
                                   th:field="*{precio}"
                                   min="0" step="0.01" required
                                   placeholder="18000.00">
                        </div>

                        <div class="mb-3">
                            <label for="duracionMinutos" class="form-label">
                                Duración en minutos
                            </label>
                            <input type="number" id="duracionMinutos"
                                   class="form-control"
                                   th:field="*{duracionMinutos}"
                                   min="1" step="1" required
                                   placeholder="30">
                        </div>

                        <div class="mb-3">
                            <label for="tipoServicio" class="form-label">
                                Tipo de servicio
                            </label>
                            <select id="tipoServicio" name="tipoServicio.id"
                                    class="form-select" required>
                                <option value="">Seleccioná una categoría</option>
                                <option th:each="tipo : ${tiposServicio}"
                                        th:value="${tipo.id}"
                                        th:text="${tipo.nombre}"
                                        th:selected="${servicio.tipoServicio != null and servicio.tipoServicio.id == tipo.id}">
                                </option>
                            </select>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/servicios}"
                               class="btn btn-secondary">Cancelar</a>

                            <button type="submit" class="btn btn-primary">
                                Guardar servicio
                            </button>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </div>
</main>

<div th:replace="~{fragments/comunes :: footer}"></div>
<div th:replace="~{fragments/comunes :: scripts}"></div>

</body>
</html>
